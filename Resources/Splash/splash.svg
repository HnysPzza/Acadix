<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
    <defs>
        <linearGradient id="splashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4361EE;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#7B2FBE;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3D5A80;stop-opacity:1" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="456" height="456" fill="url(#splashGradient)" />
    <!-- Book Pages Animation Group -->
    <g transform="translate(228, 200)">
        <!-- Left Page -->
        <path d="M-80 20 Q-40 0 0 20 L0 100 Q-40 80 -80 100 Z" fill="#FFFFFF" opacity="0.9"/>
        <line x1="-70" y1="35" x2="-10" y2="35" stroke="#E0E7FF" stroke-width="2"/>
        <line x1="-70" y1="50" x2="-10" y2="50" stroke="#E0E7FF" stroke-width="2"/>
        <line x1="-70" y1="65" x2="-10" y2="65" stroke="#E0E7FF" stroke-width="2"/>
        <!-- Right Page -->
        <path d="M80 20 Q40 0 0 20 L0 100 Q40 80 80 100 Z" fill="#FFFFFF" opacity="0.9"/>
        <line x1="10" y1="35" x2="70" y2="35" stroke="#E0E7FF" stroke-width="2"/>
        <line x1="10" y1="50" x2="70" y2="50" stroke="#E0E7FF" stroke-width="2"/>
        <line x1="10" y1="65" x2="70" y2="65" stroke="#E0E7FF" stroke-width="2"/>
        <!-- Book Spine -->
        <rect x="-5" y="20" width="10" height="80" fill="#FFFFFF" opacity="0.8"/>
        <!-- Brain/Spark Symbol Above Book -->
        <path d="M0 0 L-15 -25 L-5 -20 L0 -40 L5 -20 L15 -25 Z" fill="#FFD700"/>
        <circle cx="0" cy="-50" r="8" fill="#FFD700" opacity="0.9"/>
    </g>
    <!-- Floating Sparkles -->
    <g fill="#FFD700">
        <circle cx="100" cy="120" r="6" opacity="0.8"/>
        <circle cx="356" cy="150" r="8" opacity="0.7"/>
        <circle cx="120" cy="340" r="5" opacity="0.6"/>
        <circle cx="380" cy="300" r="7" opacity="0.8"/>
        <circle cx="80" cy="250" r="4" opacity="0.5"/>
        <circle cx="400" cy="220" r="6" opacity="0.7"/>
    </g>
    <!-- Academic Hat Element -->
    <g transform="translate(228, 110)">
        <path d="M-60 0 L0 -30 L60 0 L0 30 Z" fill="#FFFFFF" opacity="0.8"/>
        <path d="M-60 0 L-60 15 L0 45 L60 15 L60 0" fill="#FFFFFF" opacity="0.6"/>
    </g>
</svg>